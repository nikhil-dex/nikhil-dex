<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
<style>
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(430px,-20px);opacity:0}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes level{0%,70%{width:90px}100%{width:310px}}
.title{font:700 48px monospace;fill:#fff}.sub{font:16px monospace;fill:#b9c7ff}.small{font:700 14px monospace;fill:#fff}
</style>
<linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050816"/><stop offset=".55" stop-color="#101b3d"/><stop offset="1" stop-color="#050816"/></linearGradient>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<circle cx="1050" cy="70" r="120" fill="#162c63" opacity=".5"/>
<text x="55" y="70" class="title">NIKHIL.DEV</text>
<text x="58" y="98" class="sub">CODE × ANIME × AI × BUILD × RE:ANIME</text>
<text x="58" y="155" class="small">NEW COMMIT</text>
<g style="animation:bob 1.8s ease-in-out infinite">
<circle cx="565" cy="175" r="65" fill="#18223c" stroke="#5ee7ff" stroke-width="3"/>
<path d="M510 175 Q565 95 620 175" fill="#101522" stroke="#2d8cff" stroke-width="5"/>
<circle cx="540" cy="180" r="8" fill="#69eaff"/><circle cx="590" cy="180" r="8" fill="#69eaff"/>
<path d="M550 205 Q565 215 580 205" fill="none" stroke="#fff" stroke-width="3"/>
<rect x="470" y="240" width="190" height="55" rx="8" fill="#080d19" stroke="#5ee7ff" stroke-width="2"/>
<text x="535" y="274" class="small">R:A</text></g>
<g fill="#9affc9" stroke="#163d36" stroke-width="2">
<rect x="150" y="170" width="28" height="28" rx="6" style="animation:fly 2.4s .1s linear infinite"/>
<rect x="210" y="215" width="28" height="28" rx="6" style="animation:fly 2.4s .6s linear infinite"/>
<rect x="275" y="155" width="28" height="28" rx="6" style="animation:fly 2.4s 1.1s linear infinite"/>
<rect x="340" y="225" width="28" height="28" rx="6" style="animation:fly 2.4s 1.6s linear infinite"/>
</g>
<text x="760" y="145" class="small">COMMIT COLLECTED!</text>
<text x="760" y="180" class="title" style="font-size:34px">LEVEL UP!</text>
<rect x="760" y="205" width="330" height="18" rx="9" fill="#0a1020" stroke="#8cf"/>
<rect x="770" y="209" height="10" rx="5" fill="#66eaff" style="animation:level 3s ease-in-out infinite"/>
<text x="760" y="255" class="sub">SKILLS +1  ·  PROJECTS +1</text>
<text x="760" y="282" class="sub">CONSISTENCY +1  ·  BETTER ME +1</text>
<text x="760" y="325" class="sub" style="animation:glow 2s infinite">Keep building. Keep learning. Keep shipping. 🚀</text>
</svg>